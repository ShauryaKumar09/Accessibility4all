<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin: 0; background: #0a0b0e; }
  a { color: #8ab4ff; text-decoration: none; }
  a:hover { color: #b0ccff; }
</style>
</helmet>
<div style="min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 48px 24px; background: #0a0b0e; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <div style="width: 800px; min-height: 640px; display: flex; flex-direction: column; background: #14161b; border: 1px solid #262a33; border-radius: 14px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.6); zoom: {{ zoom }}">

    <div style="flex: none; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid #1f232b">
      <div style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57"></div>
      <div style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e"></div>
      <div style="width: 12px; height: 12px; border-radius: 50%; background: #28c840"></div>
      <div style="flex: 1; text-align: center; font-size: 14px; color: #7d859a; margin-right: 60px; letter-spacing: 0.2px">Accessibility4all</div>
    </div>

    <div style="flex: none; padding: 36px 44px 24px; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 34px; font-weight: 600; color: #f4f6fa; letter-spacing: -0.5px">Accessibility4all</div>
      <div style="font-size: 19px; color: #b6becd">Turn on the help you need.</div>
    </div>

    <div style="flex: 1; padding: 0 44px 8px">
      <div onClick="{{ onListClick }}" style="display: flex; flex-direction: column; gap: 14px">
        <sc-for list="{{ features }}" as="f" hint-placeholder-count="4">
          <div data-feature-id="{{ f.id }}" role="switch" tabindex="0" style="display: flex; align-items: center; gap: 24px; padding: 24px 26px; border-radius: 16px; background: #191c23; border: 2px solid; border-color: {{ f.border }}; cursor: pointer" style-hover="background: #1d212a">
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px">
              <div style="font-size: 24px; font-weight: 600; color: #f4f6fa; letter-spacing: -0.2px">{{ f.name }}</div>
              <div style="font-size: 18px; line-height: 1.4; color: #b6becd; text-wrap: pretty">{{ f.description }}</div>
            </div>
            <div style="flex: none; display: flex; align-items: center; gap: 18px">
              <div style="font-size: 18px; font-weight: 600; min-width: 36px; text-align: right; color: {{ f.stateColor }}">{{ f.stateLabel }}</div>
              <div style="width: 76px; height: 42px; border-radius: 21px; padding: 4px; box-sizing: border-box; display: flex; background: {{ f.track }}; border: 2px solid; border-color: {{ f.trackBorder }}">
                <div style="width: 30px; height: 30px; border-radius: 50%; background: #ffffff; margin-left: {{ f.knob }}"></div>
              </div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 44px 22px; border-top: 1px solid #1f232b">
      <div style="font-size: 16px; color: #7d859a">{{ hint }}</div>
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="font-size: 16px; color: #7d859a">Text size</div>
        <div onClick="{{ smaller }}" role="button" tabindex="0" style="width: 52px; height: 46px; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 2px solid #2e333e; background: #191c23; color: #f4f6fa; font-size: 18px; cursor: pointer" style-hover="border-color: #6f9bff">A−</div>
        <div onClick="{{ bigger }}" role="button" tabindex="0" style="width: 52px; height: 46px; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 2px solid #2e333e; background: #191c23; color: #f4f6fa; font-size: 22px; cursor: pointer" style-hover="border-color: #6f9bff">A+</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:760}}">
const FEATURES = [
  { id: "voice_control", name: "Voice Control", description: "Hold the ` key and tell Chrome what to do." },
  { id: "page_reader", name: "Page Reader", description: "Reads what's on your screen out loud." },
  { id: "tone_reader", name: "Tone & Social Cues", description: "Explains the tone behind a message you highlight." },
  { id: "dyslexia_font", name: "Dyslexia Font", description: "Swaps websites to an easier-to-read font." },
];

class Component extends DCLogic {
  state = { running: { voice_control: true }, scale: 1 };

  renderVals() {
    const running = this.state.running;
    const features = FEATURES.map(f => {
      const on = !!running[f.id];
      return { ...f,
        border: on ? "#4ad991" : "#262a33",
        track: on ? "#4ad991" : "#3a4051",
        trackBorder: on ? "#4ad991" : "#4a5165",
        knob: on ? "30px" : "0px",
        stateLabel: on ? "On" : "Off",
        stateColor: on ? "#4ad991" : "#7d859a",
      };
    });
    return {
      features,
      zoom: this.state.scale,
      hint: Object.values(running).filter(Boolean).length + " of 4 features on",
      onListClick: (e) => {
        const el = e.target.closest("[data-feature-id]");
        if (!el) return;
        const id = el.getAttribute("data-feature-id");
        this.setState(s => ({ running: { ...s.running, [id]: !s.running[id] } }));
      },
      smaller: () => this.setState(s => ({ scale: Math.max(0.85, +(s.scale - 0.1).toFixed(2)) })),
      bigger: () => this.setState(s => ({ scale: Math.min(1.4, +(s.scale + 0.1).toFixed(2)) })),
    };
  }
}
</script>
</body>
</html>
